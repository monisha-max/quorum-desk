<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum · Harbourline financial crime desk</title>
  <meta name="description" content="Gemini hears a flagged payment as an adversarial bench, code checks the verdict, and the record is sealed in a hash chain.">
  <meta name="theme-color" content="#0F2620">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Public+Sans:ital,wght@0,300..700;1,400&family=Spline+Sans+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F2620'/%3E%3Ctext x='16' y='23' font-family='Didot,serif' font-style='italic' font-size='22' text-anchor='middle' fill='%23E7ECE4'%3EQ%3C/text%3E%3C/svg%3E">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#chamber">Skip to the hearing</a>

  <header class="masthead">
    <div class="brand">
      <span class="wordmark">Quorum</span>
      <span class="brand-sub">Harbourline · financial crime night desk</span>
    </div>
    <dl class="ticker" id="ticker" aria-label="Desk totals"></dl>
    <div class="masthead-actions">
      <span class="chip" id="gemini-chip">Gemini</span>
      <button class="chip chip-button" id="chain-chip" type="button" aria-haspopup="dialog">Audit chain</button>
    </div>
  </header>

  <div class="desk">
    <nav class="docket" aria-label="Docket">
      <div class="docket-head">
        <h2>Docket</h2>
        <span class="docket-count" id="docket-count"></span>
      </div>
      <ol class="docket-list" id="docket"></ol>
      <dl class="stack" id="stack" aria-label="What this desk runs on"></dl>
    </nav>

    <main class="chamber" id="chamber" tabindex="-1">
      <section class="file" id="file"></section>
      <section class="plan-wrap" aria-label="The bench">
        <div class="plan" id="plan"></div>
        <div class="convene" id="convene"></div>
      </section>
      <div class="banner" id="banner" hidden></div>
      <div class="tabs" role="tablist" id="tabs" hidden>
        <button role="tab" id="tab-proceedings" aria-controls="proceedings" aria-selected="true" type="button">Proceedings</button>
        <button role="tab" id="tab-record" aria-controls="record" aria-selected="false" type="button" disabled>Record</button>
      </div>
      <section class="proceedings" id="proceedings" role="tabpanel" aria-labelledby="tab-proceedings"></section>
      <section class="record-pane" id="record" role="tabpanel" aria-labelledby="tab-record" hidden></section>
      <section class="history" id="history" aria-label="Earlier hearings on this file"></section>
    </main>

    <aside class="exhibits" aria-label="On file and exhibits">
      <section class="onfile" id="onfile"></section>
      <section class="board" id="board" aria-label="Exhibits"></section>
    </aside>
  </div>

  <dialog class="drawer" id="chain-drawer" aria-labelledby="chain-title"></dialog>
  <div class="sr-only" role="status" aria-live="polite" id="announce"></div>
  <noscript><p class="noscript">The desk needs JavaScript to stream a hearing.</p></noscript>
</body>
</html>
